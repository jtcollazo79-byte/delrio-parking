<!DOCTYPE html>
<html>
<head><title>Photo Upload Fix</title></head>
<body>
<h3>Uploading photos to Storage...</h3>
<pre id="log">Starting...</pre>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
const log = document.getElementById('log');
function addLog(msg) { log.textContent += '\n' + msg; console.log(msg); }

const firebaseConfig = {
  apiKey: "AIzaSyAo8THlHjdaA-B5DoZgAg4xUySy85MYzOo",
  authDomain: "del-rio-parking.firebaseapp.com",
  projectId: "del-rio-parking",
  storageBucket: "del-rio-parking.firebasestorage.app",
  messagingSenderId: "32189559016",
  appId: "1:32189559016:web:758d96678f68715c64595d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

function dataUrlToBlob(dataUrl) {
  const parts = dataUrl.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  const u8arr = new Uint8Array(bstr.length);
  for (let i = 0; i < bstr.length; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("DelRioParking", 3);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll() {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction("infractions", "readonly");
    const req = tx.objectStore("infractions").getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  }));
}

auth.signInAnonymously().then(async () => {
  addLog('Auth OK');
  
  const local = await dbGetAll();
  addLog('Local IndexedDB items: ' + local.length);
  
  let uploaded = 0, skipped = 0, errors = 0;
  
  for (const inf of local) {
    if (!inf.photos || inf.photos.length === 0) {
      skipped++;
      continue;
    }
    
    addLog('\nUploading ' + inf.photos.length + ' photos for: ' + (inf.tenant || inf.id));
    
    try {
      const photoUrls = [];
      for (let i = 0; i < inf.photos.length; i++) {
        const blob = dataUrlToBlob(inf.photos[i]);
        addLog('  Photo ' + i + ': ' + (blob.size/1024).toFixed(1) + 'KB');
        const ref = storage.ref('photos/' + inf.id + '_' + i + '.jpg');
        await ref.put(blob);
        const url = await ref.getDownloadURL();
        photoUrls.push(url);
        addLog('  Photo ' + i + ' OK');
      }
      
      await db.collection('infractions').doc(inf.id).update({ photoUrls });
      addLog('  Firestore updated with ' + photoUrls.length + ' URLs');
      uploaded++;
    } catch (e) {
      addLog('  ERROR: ' + e.message);
      errors++;
    }
  }
  
  addLog('\n=== DONE ===');
  addLog('Uploaded: ' + uploaded);
  addLog('Skipped (no photos): ' + skipped);
  addLog('Errors: ' + errors);
  
}).catch(e => addLog('Auth failed: ' + e.message));
</script>
</body>
</html>
